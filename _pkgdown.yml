url: https://friendly.github.io/heplots

template:
  bootstrap: 5
  includes:
    in_header: |
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
      <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
      <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous" onload="renderMathInElement(document.body);"></script>
  # params:
  #   bootswatch: cerulean
  bslib:
    base_font: {google: "Roboto"}
    heading_font: {google: "Roboto Slab"}
    code_font: {google: "JetBrains Mono"}

figures:
  other.parameters:
    rgl:
      fig.asp: 1


reference:
  - title: HE plots
    desc:  Hypothesis-Error plots
    contents:
    - starts_with("he")
    - pairs.mlm
    - mark.H0

  - title: Homogeneity of Variance
    desc: Tests and plots for homogeneity of variances and covariances
    contents:
    - bartlettTests
    - boxM
    - leveneTests
    - logdetCI
    - plot.boxM
    - eigstatCI
    - plot_boxM_boot
    - traceCI

  - title: Robust MLMs
    desc: Robust multivariate linear models
    contents:
    - cqplot
    - Mahalanobis
    - robmlm
    - plot.robmlm
    - summary.robmlm

  - title: Other plots & methods
    desc: Other plots and methods for multivariate linear models
    contents:
    - coefplot
    - covEllipses
    - distancePlot
    - glance.mlm
    - pvPlot
    - stdmodel
    - stdcoef
    - uniStats

  - title: Utility
    desc: Utility functions
    contents:
    - arrow3d
    - bbox3d
    - colDevs
    - colMeansList
    - covList
    - cross3d
    - df.terms
    - etasq
    - Ellipsoid
    - ellipse.axes
    - ellipse.box
    - ellipse3d.axes
    - gsorth
    - interpPlot
    - label.ellipse
    - rel_diff
    - noteworthy
    - termMeans
    - statList
    - trans.colors
    - text_usr

  - title: Data sets
